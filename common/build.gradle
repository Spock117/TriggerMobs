plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev'
}

version = "${mod_version}"
group = project.group

base {
    archivesName = "${mod_id}-common"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    def libsDir = file('libs')
    def ntglJars = fileTree(dir: libsDir, include: ['ntgl-*.jar', 'ntgl*.jar', '*nukateam*gun*lib*.jar']).files.findAll {
        !it.name.contains('-sources') && !it.name.contains('-javadoc') 
    }.sort { a, b -> b.name <=> a.name }
    
    if (!ntglJars.isEmpty()) {
        compileOnly files(ntglJars.first())
    } else {
        compileOnly "com.nukateam:ntgl:${project.findProperty('ntgl_version') ?: '1.21.1-3.1.3'}"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        java_version: '21',
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    filesMatching(['pack.mcmeta', '*.mixins.json']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
