modLoader = "javafml" #mandatory
loaderVersion = "*" #mandatory. Allow all forge versions as we are definding what Minecraft versions we requre later on
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL = "https://github.com/Spock117/TriggerMobs/issues"
#clientSideOnly=true #optional

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL = "https://www.curseforge.com/minecraft/mc-mods/trigger-mobs"
logoFile = "assets/${mod_id}/icon.png" #optional
credits = "${credits}" #optional
authors = $mod_authors #optional
description = "${mod_description}" #mandatory

[[dependencies.${mod_id}]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory
versionRange = "[0,)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ntgl"
mandatory = true
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "guardvillagers"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cgs"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"